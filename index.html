<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог перекладача</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="https://hikka.io" target="_blank" rel="noreferrer">
        Hikka Filter
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Увімкнути світлу тему"></button>
    </header>

    <main class="app">
      <section class="catalog-shell" aria-labelledby="page-title">
        <div class="catalog-header">
          <div>
            <p class="eyebrow">Anime catalog</p>
            <h1 id="page-title">Тайтли без українського перекладу</h1>
          </div>

          <div class="header-toggles" role="group" aria-label="Режими каталогу">
            <label class="toggle-pill">
              <input id="show-all" type="checkbox" />
              Показати всі тайтли
            </label>
            <label class="toggle-pill">
              <input id="show-ignored" type="checkbox" />
              Показати ігноровані
            </label>
          </div>
        </div>

        <form class="toolbar" id="filters">
          <div class="field field--stats">
            <span>Всього</span>
            <div class="stats" id="stats" aria-live="polite">0 тайтлів</div>
          </div>

          <label class="field field--search">
            <span>Пошук</span>
            <span class="input-wrap">
              <span class="input-icon" id="search-icon"></span>
              <input id="search" type="search" autocomplete="off" placeholder="Назва або slug" />
            </span>
          </label>

          <label class="field field--compact">
            <span>Тип</span>
            <select id="type-filter">
              <option value="all">Усі</option>
            </select>
          </label>

          <label class="field field--compact">
            <span>Сортування</span>
            <select id="sort-order">
              <option value="score-desc">Рейтинг ↓</option>
              <option value="score-asc">Рейтинг ↑</option>
              <option value="title-asc">Назва А-Я</option>
            </select>
          </label>
        </form>

        <div class="grid" id="catalog" aria-live="polite"></div>
        <nav class="pagination" id="pagination" aria-label="Пагінація каталогу"></nav>
        <p class="empty" id="empty" hidden>Нічого не знайдено.</p>
        <div class="toast" id="feedback" role="status" aria-live="polite" hidden></div>
      </section>
    </main>

    <dialog class="release-modal" id="release-modal" aria-labelledby="release-modal-title">
      <div class="release-modal__header">
        <h2 id="release-modal-title">Команди релізу</h2>
        <button class="release-modal__close" id="release-modal-close" type="button" aria-label="Закрити"></button>
      </div>
      <ul class="release-modal__teams" id="release-modal-teams"></ul>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
